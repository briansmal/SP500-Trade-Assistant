<!DOCTYPE html><html><head><title>SP500 Trade Assistant</title><style>body{background:#111;color:#fff;font-family:Segoe UI;padding:20px}.card{background:#222;margin:10px;padding:15px;border-radius:10px}#action{font-size:40px;font-weight:bold}</style></head><body><h1>SP500 Trade Assistant</h1><div class='card' id='bias'></div><div class='card' id='vix'></div><div class='card' id='sp'></div><div class='card' id='action'></div><script>async function u(){let d=await fetch('/api/snapshot').then(r=>r.json());bias.innerHTML='<h2>Bias</h2>'+d.bias;vix.innerHTML='<h2>VIX</h2>'+d.vix+' Risk Score:'+d.risk;sp.innerHTML='<h2>SP500</h2>'+d.sp;action.innerHTML=d.action;}u();setInterval(u,60000);</script></body></html>
