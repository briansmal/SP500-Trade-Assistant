<!doctype html><html><head><meta charset="utf-8"><title>SP500 Trade Assistant</title><style>body{background:#111;color:#fff;font-family:Arial} .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.card{background:#222;padding:20px;border-radius:10px} .big{font-size:32px;font-weight:bold}</style></head><body><h1>SP500 Trade Assistant</h1><div class="grid"><div class="card"><div>Bias</div><div id="bias" class="big"></div></div><div class="card"><div>VIX</div><div id="vix"></div></div><div class="card"><div>SP500</div><div id="sp"></div></div><div class="card"><div>Regime</div><div id="regime"></div></div><div class="card"><div>Divergence</div><div id="div"></div></div></div><div class="card"><h2 id="action"></h2><div id="conf"></div></div><script>fetch('/api/dashboard').then(r=>r.json()).then(d=>{bias.textContent=d.bias;vix.textContent=d.vix+' '+d.vixRisk;sp.textContent=d.sp500;regime.textContent=d.regime;div.textContent=d.divergence;action.textContent=d.action;conf.textContent='Confidence '+d.confidence+'%';});</script></body></html>
