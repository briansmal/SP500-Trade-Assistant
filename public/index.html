<!DOCTYPE html><html><head><meta charset="utf-8"><title>SP500 Assistant</title><style>body{background:#111;color:#fff;font-family:Segoe UI;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.card{background:#222;padding:20px;border-radius:12px;text-align:center}.big{font-size:32px;font-weight:bold}</style></head><body><h1>SP500 Five Card Dashboard</h1><div class="grid"><div class="card"><h3>BIAS</h3><div id=bias class=big></div></div><div class="card"><h3>CONFIDENCE</h3><div id=conf class=big></div></div><div class="card"><h3>VIX</h3><div id=vix class=big></div></div><div class="card"><h3>REGIME</h3><div id=regime class=big></div></div><div class="card"><h3>ACTION</h3><div id=action class=big></div></div></div><script>async function load(){let r=await fetch('/api/dashboard');let d=await r.json();bias.textContent=d.bias;conf.textContent=d.confidence+'%';vix.textContent=d.vix.toFixed(2)+' '+d.risk;regime.textContent=d.regime;action.textContent=d.action;} load(); setInterval(load,60000);</script></body></html>
